<script>
// ================================================================

// ── 1. DEFAULT CONFIG (fallback if Firebase not connected) ──────
const DEFAULT_CONFIG = {

    {
      keywords: ["opening", "openings", "first move", "e4", "d4", "sicilian", "ruy lopez"],
      reply: "🎯 **Popular Chess Openings:**\n\n♟️ **1.e4 Openings:**\n• Ruy Lopez (Spanish) — Classical and solid\n• Sicilian Defense — Sharp and aggressive\n• Italian Game — Great for beginners\n• French Defense — Solid for Black\n\n♟️ **1.d4 Openings:**\n• Queen's Gambit — Very principled\n• King's Indian Defense — Dynamic for Black\n• London System — Easy to learn\n\nWhich opening would you like to explore?"
    },
    {
      keywords: ["tactic", "tactics", "fork", "pin", "skewer", "discovered", "combination"],
      reply: "🎯 **Chess Tactics:**\n\n⚡ **Fork** — One piece attacks two enemy pieces simultaneously\n📌 **Pin** — A piece can't move without exposing a more valuable piece\n🗡️ **Skewer** — Like a pin but the more valuable piece is in front\n💡 **Discovered Attack** — Moving one piece reveals an attack by another\n♟️ **Zwischenzug** — An 'in-between' move that changes the sequence\n🏆 **Deflection** — Force a piece away from defending a key square\n\nPractice tactics daily at Chess.com or Lichess.org!"
    },
    {
      keywords: ["endgame", "end game", "king pawn", "rook endgame"],
      reply: "♔ **Endgame Essentials:**\n\n• **King Activity** — Activate your King in the endgame!\n• **Pawn Structure** — Passed pawns are powerful\n• **Opposition** — Key concept for King vs King\n• **Lucena & Philidor** — Essential rook endgame positions\n• **Triangulation** — Technique to gain or lose a tempo\n\nThe endgame is where games are won and lost. Would you like to practice specific positions?"
    },
    {
      keywords: ["checkmate", "mate", "mating pattern"],
      reply: "♚ **Common Mating Patterns:**\n\n• 👑 **Scholar's Mate** — Quick 4-move checkmate (learn to defend it!)\n• 🏰 **Back Rank Mate** — Rook/Queen on the 8th rank\n• ♞ **Smothered Mate** — Knight delivers mate when King is surrounded\n• ⚡ **Fool's Mate** — The fastest possible checkmate (2 moves)\n• 🎯 **Anastasia's Mate** — Knight + Rook combination\n\nKnowing mating patterns helps you both attack and defend!"

    {

  // Menu buttons
  menuItems: [
    { icon: "♟️", label: "Openings",   message: "Best opening moves" },
    { icon: "🎯", label: "Tactics",    message: "Tactics tips" },
    { icon: "♔", label: "Endgames",  message: "Endgame tips" },
    { icon: "📖", label: "Rules",      message: "Chess rules" },

// ── 2. STATE ────────────────────────────────────────────────────
let config = { ...DEFAULT_CONFIG };
let isTyping = false;

// ── 3. FIREBASE LOADER ─────────────────────────────────────────
async function loadConfigFromFirebase() {
  if (!window._vruminiDB) return;
  try {
    const db = window._vruminiDB;
    const snap = await window._firestoreGet(
      window._firestoreDoc(db, "vrumini_config", "main")
    );
    if (snap.exists()) {
      const data = snap.data();
      config = { ...DEFAULT_CONFIG, ...data };
      console.log("✅ Config loaded from Firebase");
    }
  } catch (e) {
    console.log("Firebase config load skipped:", e.message);
  }
}

// ── 4. KEYWORD MATCHER ─────────────────────────────────────────
function matchKeyword(input) {
  const lower = input.toLowerCase().trim();
  for (const entry of config.keywordReplies) {
    if (entry.keywords.some(k => lower.includes(k))) {
      return entry.reply;
    }
  }
  return null;
}

// ── 5. CLAUDE AI CALL ──────────────────────────────────────────
async function callClaudeAI(userMessage, conversationHistory) {
  const messages = conversationHistory.map(m => ({
    role: m.role,
    content: m.content
  }));
  messages.push({ role: "user", content: userMessage });

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system: `You are Vrumini, a friendly and knowledgeable female chess AI assistant. 
Your personality: warm, encouraging, passionate about chess, uses chess emojis (♟️♔♕♖♗♘♚♛♜♝♞).
You ONLY answer questions related to chess — openings, tactics, strategy, rules, history, famous players, tournaments, endgames, and improvement tips.
If asked about non-chess topics, politely redirect: "I'm specialized in chess! Ask me anything about the game ♟️"
Keep answers concise, clear, and friendly. Use bullet points for lists. Always end with an encouraging line or follow-up question.`,
      messages: messages
    })
  });

  if (!response.ok) {
    const err = await response.json();
    throw new Error(err.error?.message || "API error");
  }

  const data = await response.json();
  return data.content[0].text;
}

// ── 6. CONVERSATION HISTORY ────────────────────────────────────
const conversationHistory = [];

// ── 7. UI HELPERS ──────────────────────────────────────────────
const messagesEl = document.getElementById("messages");

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMessage(text, sender, labelType = null) {
  const row = document.createElement("div");
  row.className = `msg-row ${sender}`;

  const av = document.createElement("div");
  av.className = `msg-avatar ${sender}`;
  av.textContent = sender === "bot" ? "👩🏻" : "🧑";

  const bubble = document.createElement("div");
  bubble.className = `bubble ${sender}`;

  if (labelType) {
    const label = document.createElement("div");
    label.className = `label ${labelType}`;
    const labels = {
      "ai-label":   "✨ AI Reply",
      "kw-label":   "🔑 Keyword Reply",
      "menu-label": "📋 Menu",
      "welcome-label": "👋 Welcome"
    };
    label.textContent = labels[labelType] || "";
    bubble.appendChild(label);
  }

  // Render simple markdown bold
  const content = document.createElement("div");
  content.innerHTML = text
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/\n/g, "<br>");
  bubble.appendChild(content);

  row.appendChild(av);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollBottom();
  return bubble;
}

function showMenu() {
  const row = document.createElement("div");
  row.className = "msg-row bot";

  const av = document.createElement("div");
  av.className = "msg-avatar bot";
  av.textContent = "👩🏻";

  const bubble = document.createElement("div");
  bubble.className = "bubble bot";

  const label = document.createElement("div");
  label.className = "label menu-label";
  label.textContent = "📋 Menu";
  bubble.appendChild(label);

  const intro = document.createElement("div");
  intro.innerHTML = "What would you like to explore today?<br>";
  bubble.appendChild(intro);

  const grid = document.createElement("div");
  grid.className = "menu-grid";

  config.menuItems.forEach(item => {
    const btn = document.createElement("button");
    btn.className = "menu-btn";
    btn.innerHTML = `${item.icon} ${item.label}`;
    btn.onclick = () => sendMessage(item.message);
    grid.appendChild(btn);
  });

  bubble.appendChild(grid);
  row.appendChild(av);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollBottom();
}

function showTyping() {
  const row = document.createElement("div");
  row.className = "msg-row bot";
  row.id = "typingRow";

  const av = document.createElement("div");
  av.className = "msg-avatar bot";
  av.textContent = "👩🏻";

  const bubble = document.createElement("div");
  bubble.className = "bubble bot typing-bubble";
  for (let i = 0; i < 3; i++) {
    const d = document.createElement("div");
    d.className = "typing-dot";
    bubble.appendChild(d);
  }

  row.appendChild(av);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollBottom();
}

function removeTyping() {
  const t = document.getElementById("typingRow");
  if (t) t.remove();
}

// ── 8. SEND LOGIC ──────────────────────────────────────────────
async function sendMessage(text) {
  if (!text.trim() || isTyping) return;
  isTyping = true;

  const sendBtn = document.getElementById("sendBtn");
  sendBtn.disabled = true;

  addMessage(text, "user");
  conversationHistory.push({ role: "user", content: text });

  showTyping();
  await new Promise(r => setTimeout(r, 600)); // natural delay

  // Priority: keyword → menu → AI
  const kwMatch = matchKeyword(text);

  if (kwMatch === "SHOW_MENU") {
    removeTyping();
    showMenu();
    conversationHistory.push({ role: "assistant", content: "[Menu shown]" });
  } else if (kwMatch) {
    removeTyping();
    addMessage(kwMatch, "bot", "kw-label");
    conversationHistory.push({ role: "assistant", content: kwMatch });
  } else {
    // AI reply
    try {
      const aiReply = await callClaudeAI(text, conversationHistory.slice(-8));
      removeTyping();
      addMessage(aiReply, "bot", "ai-label");
      conversationHistory.push({ role: "assistant", content: aiReply });
    } catch (err) {
      removeTyping();
      const fallback = "♟️ I'm having a moment! Please check that the Claude API key is configured. Try asking again or type 'menu' for quick options.";
      addMessage(fallback, "bot");
      console.error("AI error:", err);
    }
  }

  isTyping = false;
  sendBtn.disabled = false;
}

function sendFromInput() {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (text) {
    input.value = "";
    input.style.height = "auto";
    sendMessage(text);
  }
}

// ── 9. INPUT AUTO-RESIZE + ENTER KEY ──────────────────────────
const chatInput = document.getElementById("chatInput");

chatInput.addEventListener("input", () => {
  chatInput.style.height = "auto";
  chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + "px";
});

chatInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendFromInput();
  }
});

// ── 10. INIT ────────────────────────────────────────────────────
async function init() {
  // Try to load Firebase config
  if (window._firebaseReady) {
    await loadConfigFromFirebase();
  } else {
    window.addEventListener("firebaseReady", loadConfigFromFirebase);
  }

  // Show welcome message
  setTimeout(() => {
    addMessage(config.welcomeMessage, "bot", "welcome-label");
    setTimeout(showMenu, 800);
  }, 300);
}

init();
</script>
