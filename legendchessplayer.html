<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chess Legends — Hall of Fame</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --gold:#d4af37;--gold2:#f0cc50;
  --bg:#07070e;--bg2:#0f0f1c;--bg3:#16162a;
  --glass:rgba(255,255,255,0.04);
  --border:rgba(212,175,55,0.18);
  --text:#e8e8f0;--muted:#6b6b8a;
  --red:#e05555;--green:#4caf7d;
  --radius:16px;--radius-sm:10px;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;}

.board-bg{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:repeating-conic-gradient(rgba(212,175,55,.025) 0% 25%,transparent 0% 50%);background-size:56px 56px;}
.pieces-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.piece{position:absolute;color:var(--gold);opacity:.05;font-size:clamp(20px,3vw,48px);user-select:none;animation:floatPiece var(--dur,12s) ease-in-out infinite;animation-delay:var(--delay,0s);}
@keyframes floatPiece{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-22px) rotate(5deg);}}

nav{position:sticky;top:0;z-index:100;background:rgba(7,7,14,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);padding:0 clamp(16px,4vw,40px);height:64px;display:flex;align-items:center;justify-content:space-between;}
.nav-brand{display:flex;align-items:center;gap:10px;}
.nav-brand .crown{font-size:26px;color:var(--gold);filter:drop-shadow(0 0 8px rgba(212,175,55,.5));}
.nav-brand span{font-size:18px;font-weight:800;letter-spacing:-.4px;}
.nav-brand span b{color:var(--gold);}
.nav-links{display:flex;gap:6px;}
.nav-links a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;padding:7px 14px;border-radius:var(--radius-sm);transition:.2s;}
.nav-links a:hover{color:var(--text);background:var(--glass);}
.nav-links a.active{color:#000;background:var(--gold);}

.hero{position:relative;z-index:1;text-align:center;padding:clamp(40px,7vw,72px) 20px 24px;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.3);border-radius:50px;padding:6px 18px;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.8px;text-transform:uppercase;margin-bottom:16px;animation:fadeDown .6s ease-out;}
.hero h1{font-size:clamp(28px,5vw,54px);font-weight:900;line-height:1.1;margin-bottom:8px;animation:fadeDown .7s ease-out;}
.hero h1 span{background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero p{color:var(--muted);font-size:15px;animation:fadeDown .8s ease-out;}
@keyframes fadeDown{from{opacity:0;transform:translateY(-16px);}to{opacity:1;transform:translateY(0);}}

.stats-bar{position:relative;z-index:1;display:flex;justify-content:center;gap:clamp(24px,5vw,64px);padding:20px 20px 28px;flex-wrap:wrap;}
.stat-item{text-align:center;}
.stat-val{font-size:28px;font-weight:900;color:var(--gold);line-height:1;}
.stat-label{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.5px;}

.filters-wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 clamp(12px,3vw,24px) 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.search-box{flex:1;min-width:220px;position:relative;}
.search-box input{width:100%;background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;padding:10px 14px 10px 42px;outline:none;transition:.2s;}
.search-box input:focus{border-color:rgba(212,175,55,.5);}
.search-box::before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none;}
.filter-select{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;padding:10px 14px;outline:none;cursor:pointer;transition:.2s;}
.filter-select:focus{border-color:rgba(212,175,55,.5);}
.filter-select option{background:#1a1a2e;}
.filter-btn{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--muted);font-size:13px;font-weight:600;padding:10px 16px;cursor:pointer;transition:.2s;}
.filter-btn:hover,.filter-btn.on{color:var(--gold);border-color:rgba(212,175,55,.4);background:rgba(212,175,55,.08);}

.grid-wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 clamp(12px,3vw,24px) 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}

.player-card{background:var(--glass);border:1px solid var(--border);border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s;animation:cardIn .4s ease-out backwards;}
.player-card:hover{transform:translateY(-5px);border-color:rgba(212,175,55,.35);box-shadow:0 16px 48px rgba(212,175,55,.08);}
@keyframes cardIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

.card-top{position:relative;height:110px;background:linear-gradient(135deg,rgba(212,175,55,.08),rgba(212,175,55,.02));}
.card-board-bg{position:absolute;inset:0;background-image:repeating-conic-gradient(rgba(212,175,55,.06) 0% 25%,transparent 0% 50%);background-size:24px 24px;}
.card-avatar{position:absolute;bottom:-36px;left:20px;width:72px;height:72px;border-radius:50%;border:3px solid var(--bg);background:rgba(212,175,55,.15);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:var(--gold);overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.5);}
.card-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.card-badges{position:absolute;top:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:50px;}
.badge-title{background:rgba(212,175,55,.2);border:1px solid rgba(212,175,55,.3);color:var(--gold);}
.badge-champ{background:rgba(212,175,55,.25);border:1px solid rgba(212,175,55,.4);color:var(--gold2);}
.badge-active{background:rgba(76,175,125,.15);border:1px solid rgba(76,175,125,.3);color:var(--green);}

.card-body{padding:46px 20px 18px;}
.card-name{font-size:18px;font-weight:800;margin-bottom:3px;}
.card-country{font-size:13px;color:var(--muted);margin-bottom:12px;}
.card-meta{display:flex;gap:16px;flex-wrap:wrap;}
.meta-item{font-size:12px;}
.meta-label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.4px;display:block;}
.meta-val{font-weight:600;color:var(--text);}
.meta-val.gold{color:var(--gold);font-weight:800;}
.card-footer{padding:0 20px 16px;border-top:1px solid rgba(255,255,255,.05);padding-top:12px;display:flex;justify-content:space-between;align-items:center;}
.pgn-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.18);border-radius:50px;padding:4px 10px;color:var(--gold);}

/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.82);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .3s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:24px;width:100%;max-width:660px;max-height:92vh;overflow-y:auto;transform:scale(.95) translateY(16px);transition:transform .35s cubic-bezier(.22,1,.36,1);}
.modal-overlay.open .modal{transform:scale(1) translateY(0);}
.modal-header{position:relative;height:150px;background:linear-gradient(135deg,rgba(212,175,55,.12),rgba(212,175,55,.04));overflow:hidden;flex-shrink:0;}
.modal-board{position:absolute;inset:0;background-image:repeating-conic-gradient(rgba(212,175,55,.07) 0% 25%,transparent 0% 50%);background-size:32px 32px;}
.modal-close{position:absolute;top:14px;right:14px;width:36px;height:36px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);border-radius:50%;color:var(--muted);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;z-index:1;}
.modal-close:hover{color:var(--text);}
.modal-avatar{position:absolute;bottom:-40px;left:28px;width:80px;height:80px;border-radius:50%;border:4px solid var(--bg2);background:rgba(212,175,55,.15);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:var(--gold);overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.6);}
.modal-avatar img{width:100%;height:100%;object-fit:cover;}
.modal-body{padding:52px 28px 28px;}
.modal-name{font-size:24px;font-weight:900;margin-bottom:6px;}
.modal-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.chip{font-size:11px;font-weight:700;padding:4px 11px;border-radius:50px;}
.chip-gold{background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.25);color:var(--gold);}
.chip-green{background:rgba(76,175,125,.1);border:1px solid rgba(76,175,125,.25);color:var(--green);}
.chip-gray{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--muted);}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
@media(max-width:460px){.info-grid{grid-template-columns:1fr;}}
.info-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:var(--radius-sm);padding:11px 14px;}
.info-box .ib-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.info-box .ib-val{font-size:14px;font-weight:600;}
.info-box .ib-val.gold{color:var(--gold);}

.sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--gold);margin:18px 0 10px;display:flex;align-items:center;gap:8px;}
.sec-title::after{content:"";flex:1;height:1px;background:rgba(212,175,55,.15);}

.wiki-btn{display:inline-flex;align-items:center;gap:8px;background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.25);border-radius:var(--radius-sm);padding:10px 20px;color:var(--gold);font-size:13px;font-weight:700;text-decoration:none;transition:.2s;margin-bottom:14px;}
.wiki-btn:hover{background:rgba(212,175,55,.18);}

.pgn-dl{display:flex;flex-direction:column;gap:7px;}
.pgn-dl a{display:flex;align-items:center;gap:12px;background:rgba(212,175,55,.06);border:1px solid rgba(212,175,55,.15);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);text-decoration:none;transition:.2s;}
.pgn-dl a:hover{background:rgba(212,175,55,.12);transform:translateX(3px);}
.pgn-dl a .di-name{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pgn-dl a .di-meta{font-size:11px;color:var(--muted);}
.pgn-dl a .di-dl{font-size:18px;color:var(--gold);flex-shrink:0;}

.state-box{grid-column:1/-1;text-align:center;padding:80px 20px;}
.state-icon{font-size:56px;margin-bottom:16px;animation:floatPiece 3s ease-in-out infinite;display:block;}
.state-box h2{font-size:22px;font-weight:700;margin-bottom:8px;}
.state-box p{color:var(--muted);font-size:14px;}
.loader-dots{display:flex;gap:8px;justify-content:center;margin:20px 0;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:dotPulse 1.2s ease-in-out infinite;}
.dot:nth-child(2){animation-delay:.2s;}.dot:nth-child(3){animation-delay:.4s;}
@keyframes dotPulse{0%,80%,100%{opacity:.2;transform:scale(.9);}40%{opacity:1;transform:scale(1.2);}}

::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:rgba(212,175,55,.2);border-radius:3px;}
</style>
</head>
<body>

<div class="board-bg"></div>
<div class="pieces-bg" id="piecesBg"></div>

<nav>
  <div class="nav-brand">
    <span class="crown">♛</span>
    <span><b>Chess</b>Birthday</span>
  </div>
  <div class="nav-links">
    <a href="legendchessplayerform.html">Add Legend</a>
    <a href="legendchessplayer.html" class="active">View Legends</a>
    <a href="chessbornmatch.html">Birthday Match</a>
  </div>
</nav>

<div class="hero">
  <div class="hero-badge">♛ Hall of Fame</div>
  <h1>Chess <span>Legends</span></h1>
  <p id="heroSub">Loading legendary players…</p>
</div>

<div class="stats-bar" id="statsBar"></div>

<div class="filters-wrap">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search by name or country…" oninput="applyFilters()"/>
  </div>
  <select class="filter-select" id="filterCountry" onchange="applyFilters()">
    <option value="">All Countries</option>
  </select>
  <select class="filter-select" id="filterTitle" onchange="applyFilters()">
    <option value="">All Titles</option>
  </select>
  <button class="filter-btn" id="btnChampion" onclick="toggleChampion()">♛ Champions</button>
  <button class="filter-btn" id="btnActive" onclick="toggleActive()">✅ Active</button>
</div>

<div id="gridWrap" class="grid-wrap">
  <div class="state-box">
    <span class="state-icon">♞</span>
    <h2>Loading Legends</h2>
    <div class="loader-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-board"></div>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
      <div class="modal-avatar" id="mAvatar"></div>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBXrHcMJzQn3cxutg41LZs9oYwEfALe00s",
  authDomain: "ratedeventsgj.firebaseapp.com",
  projectId: "ratedeventsgj",
  storageBucket: "ratedeventsgj.firebasestorage.app",
  messagingSenderId: "527826897689",
  appId: "1:527826897689:web:fb0439fff04a695a599388"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

let allPlayers = [];
let showChampion = false;
let showActive = false;

/* Floating pieces */
(function(){
  const p=["♔","♕","♖","♗","♘","♙","♚","♛","♜","♝","♞","♟"];
  const bg=document.getElementById("piecesBg");
  p.forEach((ch,i)=>{
    const d=document.createElement("div");d.className="piece";d.textContent=ch;
    d.style.cssText=`left:${(i*8.5)%98}%;top:${(i*13.7)%95}%;font-size:${20+Math.random()*36}px;--dur:${9+i*1.4}s;--delay:${i*0.6}s;`;
    bg.appendChild(d);
  });
})();

function ini(n){return(n||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();}
function fmtDate(d){
  if(!d) return "—";
  return new Date(d+"T00:00:00").toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
}

/* Live listener */
const q=query(collection(db,"legendplayerdb"),orderBy("createdAt","desc"));
onSnapshot(q, snap=>{
  allPlayers = snap.docs.map(d=>({id:d.id,...d.data()}));
  buildFilters();
  renderStats();
  applyFilters();
  document.getElementById("heroSub").textContent=
    `Discover ${allPlayers.length} legendary grandmaster${allPlayers.length!==1?"s":""}`;
}, err=>{
  document.getElementById("gridWrap").innerHTML=`<div class="state-box">
    <span class="state-icon">⚠️</span><h2>Connection Error</h2>
    <p>${err.message}</p></div>`;
});

function buildFilters(){
  const countries=[...new Set(allPlayers.map(p=>p.country).filter(Boolean))].sort();
  const titles=[...new Set(allPlayers.map(p=>p.title).filter(Boolean))].sort();
  document.getElementById("filterCountry").innerHTML=
    `<option value="">All Countries</option>`+countries.map(c=>`<option value="${c}">${c}</option>`).join("");
  document.getElementById("filterTitle").innerHTML=
    `<option value="">All Titles</option>`+titles.map(t=>`<option value="${t}">${t}</option>`).join("");
}

function renderStats(){
  const champs=allPlayers.filter(p=>p.worldChampion).length;
  const countries=[...new Set(allPlayers.map(p=>p.country))].length;
  const active=allPlayers.filter(p=>p.active).length;
  document.getElementById("statsBar").innerHTML=
    [[allPlayers.length,"Total Players"],[champs,"World Champions"],[countries,"Countries"],[active,"Active"]]
    .map(([v,l])=>`<div class="stat-item"><div class="stat-val">${v}</div><div class="stat-label">${l}</div></div>`).join("");
}

window.applyFilters=function(){
  const q=document.getElementById("searchInput").value.toLowerCase();
  const country=document.getElementById("filterCountry").value;
  const title=document.getElementById("filterTitle").value;
  const filtered=allPlayers.filter(p=>
    (!q||(p.name||"").toLowerCase().includes(q)||(p.country||"").toLowerCase().includes(q))
    &&(!country||p.country===country)
    &&(!title||p.title===title)
    &&(!showChampion||p.worldChampion)
    &&(!showActive||p.active)
  );
  renderGrid(filtered);
};
window.toggleChampion=function(){
  showChampion=!showChampion;
  document.getElementById("btnChampion").classList.toggle("on",showChampion);
  applyFilters();
};
window.toggleActive=function(){
  showActive=!showActive;
  document.getElementById("btnActive").classList.toggle("on",showActive);
  applyFilters();
};

function renderGrid(players){
  const wrap=document.getElementById("gridWrap");
  if(!players.length){
    wrap.innerHTML=`<div class="state-box">
      <span class="state-icon">♟</span><h2>No Players Found</h2>
      <p>Try adjusting your search or filters</p></div>`;
    return;
  }
  wrap.innerHTML=players.map((p,i)=>`
    <div class="player-card" data-id="${p.id}" style="animation-delay:${i*0.05}s">
      <div class="card-top">
        <div class="card-board-bg"></div>
        <div class="card-badges">
          <span class="badge badge-title">${p.title||"GM"}</span>
          ${p.worldChampion?`<span class="badge badge-champ">♛</span>`:""}
          ${p.active?`<span class="badge badge-active">Active</span>`:""}
        </div>
        <div class="card-avatar">
          ${p.photoURL?`<img src="${p.photoURL}" alt="${p.name}" onerror="this.style.display='none'">`:`<span>${ini(p.name)}</span>`}
        </div>
      </div>
      <div class="card-body">
        <div class="card-name">${p.name||"Unknown"}</div>
        <div class="card-country">${p.country||""}</div>
        <div class="card-meta">
          <div class="meta-item"><span class="meta-label">Born</span><span class="meta-val">${fmtDate(p.dob)}</span></div>
          ${p.peakRating?`<div class="meta-item"><span class="meta-label">Peak</span><span class="meta-val gold">${p.peakRating}</span></div>`:""}
          ${p.fideId?`<div class="meta-item"><span class="meta-label">FIDE ID</span><span class="meta-val">${p.fideId}</span></div>`:""}
        </div>
      </div>
      ${(p.gamesCollection||[]).length?`
      <div class="card-footer">
        <span class="pgn-pill">♟ ${p.gamesCollection.length} game${p.gamesCollection.length>1?"s":""}</span>
        <span style="font-size:12px;color:var(--muted)">View →</span>
      </div>`:`<div style="height:10px"></div>`}
    </div>`).join("");

  wrap.querySelectorAll(".player-card").forEach(el=>{
    el.addEventListener("click",()=>openModal(el.dataset.id));
  });
}

window.openModal=function(id){
  const p=allPlayers.find(x=>x.id===id);if(!p) return;
  const mAv=document.getElementById("mAvatar");
  mAv.innerHTML=p.photoURL
    ?`<img src="${p.photoURL}" alt="${p.name}" onerror="this.style.display='none'">`
    :`<span>${ini(p.name)}</span>`;

  const pgns=p.gamesCollection||[];
  const pgnHTML=pgns.length?`
    <div class="sec-title">♟ Notable Games</div>
    <div class="pgn-dl">
      ${pgns.map(g=>`
        <a href="${g.url}" download="${g.name}" target="_blank">
          <span style="font-size:18px">♟</span>
          <div style="flex:1;min-width:0">
            <div class="di-name">${g.name}</div>
            <div class="di-meta">${g.size?(g.size/1024).toFixed(1)+" KB · ":""}PGN Game File</div>
          </div>
          <span class="di-dl">⬇</span>
        </a>`).join("")}
    </div>`:"";

  document.getElementById("mBody").innerHTML=`
    <div class="modal-name">${p.name}</div>
    <div class="modal-chips">
      <span class="chip chip-gold">${p.title||"GM"}</span>
      ${p.worldChampion?`<span class="chip chip-gold">♛ World Champion</span>`:""}
      ${p.active?`<span class="chip chip-green">Active</span>`:`<span class="chip chip-gray">Retired</span>`}
      <span class="chip chip-gray">${p.country||""}</span>
    </div>
    <div class="info-grid">
      <div class="info-box"><div class="ib-label">Date of Birth</div><div class="ib-val">${fmtDate(p.dob)}</div></div>
      ${p.dod?`<div class="info-box"><div class="ib-label">Date of Death</div><div class="ib-val">${fmtDate(p.dod)}</div></div>`:""}
      ${p.peakRating?`<div class="info-box"><div class="ib-label">Peak Rating</div><div class="ib-val gold">${p.peakRating}</div></div>`:""}
      ${p.fideId?`<div class="info-box"><div class="ib-label">FIDE ID</div><div class="ib-val">${p.fideId}</div></div>`:""}
    </div>
    ${p.wikipedia?`<a class="wiki-btn" href="${p.wikipedia}" target="_blank" rel="noopener">📖 View on Wikipedia</a>`:""}
    ${pgnHTML}`;

  document.getElementById("modalOverlay").classList.add("open");
  document.body.style.overflow="hidden";
};
window.closeModal=function(e){if(e.target===document.getElementById("modalOverlay")) closeModalDirect();};
window.closeModalDirect=function(){document.getElementById("modalOverlay").classList.remove("open");document.body.style.overflow="";};
document.addEventListener("keydown",e=>{if(e.key==="Escape") closeModalDirect();});
</script>
</body>
</html>
