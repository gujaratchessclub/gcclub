<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chess Legends — Study Material</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#05050f;--bg2:#0d0d1f;--bg3:#13132a;
  --blue:#4f8ef7;--blue2:#6fa8ff;--pink:#e040a0;--pink2:#ff6ec7;
  --purple:#9b5de5;--cyan:#00d4ff;--gold:#d4af37;--gold2:#f0cc50;
  --text:#eaeaf8;--muted:#5a5a82;--muted2:#8888b0;
  --red:#ff4f6e;--green:#3fd68f;
  --border:rgba(79,142,247,0.18);
  --glass:rgba(255,255,255,0.03);
  --r:12px;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;}

/* BG */
.bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.1;animation:orbF var(--od,20s) ease-in-out infinite;animation-delay:var(--odl,0s);}
.orb1{width:520px;height:520px;background:radial-gradient(circle,#4f8ef7,transparent);top:-130px;left:-130px;}
.orb2{width:440px;height:440px;background:radial-gradient(circle,#e040a0,transparent);bottom:-100px;right:-100px;}
.orb3{width:320px;height:320px;background:radial-gradient(circle,#9b5de5,transparent);top:45%;left:42%;}
@keyframes orbF{0%,100%{transform:translate(0,0);}50%{transform:translate(26px,-18px);}}
.pieces-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.fpiece{position:absolute;user-select:none;animation:fp var(--fd,14s) ease-in-out infinite;animation-delay:var(--fdl,0s);font-size:var(--fs,28px);opacity:.055;}
@keyframes fp{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-22px) rotate(6deg);}}

/* NAV */
nav{position:sticky;top:0;z-index:100;height:58px;background:rgba(5,5,15,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,3vw,32px);}
.brand{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;text-decoration:none;}
.brand .icon{font-size:22px;background:linear-gradient(135deg,var(--blue),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.brand span{background:linear-gradient(135deg,var(--blue2),var(--pink2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.nav-right{display:flex;align-items:center;gap:8px;}
.btn-admin-login{background:linear-gradient(135deg,rgba(79,142,247,.15),rgba(224,64,160,.1));border:1px solid rgba(79,142,247,.3);color:var(--blue2);font-size:12px;font-weight:700;padding:7px 16px;border-radius:8px;cursor:pointer;transition:.15s;}
.btn-admin-login:hover{border-color:rgba(79,142,247,.5);}
.admin-badge{display:none;align-items:center;gap:6px;background:rgba(63,214,143,.1);border:1px solid rgba(63,214,143,.25);border-radius:8px;padding:5px 12px;font-size:11px;font-weight:700;color:var(--green);}
.admin-badge.show{display:flex;}
.btn-logout{background:none;border:none;color:var(--muted2);font-size:11px;cursor:pointer;padding:2px 6px;transition:.15s;}
.btn-logout:hover{color:var(--red);}

/* HERO */
.hero{position:relative;z-index:1;text-align:center;padding:clamp(32px,6vw,60px) 20px 18px;}
.hero-badge{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,rgba(79,142,247,.12),rgba(224,64,160,.08));border:1px solid rgba(79,142,247,.28);border-radius:50px;padding:5px 18px;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;margin-bottom:14px;animation:fadeD .6s ease-out;}
.hero-badge span{background:linear-gradient(135deg,var(--blue2),var(--pink2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero h1{font-size:clamp(24px,5vw,48px);font-weight:900;line-height:1.1;margin-bottom:8px;animation:fadeD .7s ease-out;}
.hero h1 .g{background:linear-gradient(135deg,var(--blue2),var(--pink2),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero p{color:var(--muted2);font-size:14px;animation:fadeD .8s ease-out;}
@keyframes fadeD{from{opacity:0;transform:translateY(-12px);}to{opacity:1;transform:translateY(0);}}

/* STATS */
.stats-bar{position:relative;z-index:1;display:flex;justify-content:center;gap:clamp(18px,5vw,52px);padding:14px 20px 20px;flex-wrap:wrap;}
.sv{font-size:24px;font-weight:900;line-height:1;}
.sl{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.5px;}

/* FILTERS */
.filters{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 clamp(12px,3vw,22px) 14px;display:flex;gap:8px;flex-wrap:wrap;}
.search-box{flex:1;min-width:190px;position:relative;}
.search-box input{width:100%;background:var(--glass);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:13px;padding:9px 14px 9px 36px;outline:none;transition:.15s;}
.search-box input:focus{border-color:rgba(79,142,247,.5);}
.search-box::before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none;}
.fsel{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:12px;padding:9px 12px;outline:none;cursor:pointer;}
.fsel option{background:#0d0d1f;}
.fbtn{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);color:var(--muted2);font-size:12px;font-weight:600;padding:9px 13px;cursor:pointer;transition:.15s;}
.fbtn:hover,.fbtn.on{color:var(--blue2);border-color:rgba(79,142,247,.4);background:rgba(79,142,247,.07);}

/* ── GRID — compact square cards ── */
.grid{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 clamp(12px,3vw,22px) 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:14px;}

/* ── RAINBOW BORDER GLOW CARD ── */
@property --border-angle {
  syntax: '<angle>';
  inherits: false;
  initial-value: 0deg;
}
.card{
  position:relative;border-radius:18px;cursor:pointer;
  background:var(--glass);backdrop-filter:blur(10px);
  animation:cardIn .35s ease-out backwards;
  transition:transform .2s,box-shadow .2s;
}
.card::before{
  content:'';position:absolute;inset:-2px;border-radius:20px;z-index:-1;
  background:conic-gradient(from var(--border-angle),
    #4f8ef7 0%,#9b5de5 20%,#e040a0 40%,#ff6ec7 55%,#00d4ff 70%,#4f8ef7 100%);
  animation:borderSpin 3s linear infinite;
  opacity:.6;
  transition:opacity .2s;
}
.card::after{
  content:'';position:absolute;inset:-2px;border-radius:20px;z-index:-1;
  background:conic-gradient(from var(--border-angle),
    #4f8ef7 0%,#9b5de5 20%,#e040a0 40%,#ff6ec7 55%,#00d4ff 70%,#4f8ef7 100%);
  animation:borderSpin 3s linear infinite;
  filter:blur(8px);
  opacity:.3;
}
@keyframes borderSpin{to{--border-angle:360deg;}}
/* Fallback for browsers without @property */
@supports not (background: conic-gradient(from 0deg, red, blue)) {
  .card::before,.card::after{background:linear-gradient(135deg,var(--blue),var(--pink),var(--purple));}
}
.card:hover{transform:translateY(-5px);}
.card:hover::before{opacity:.9;}
.card:hover::after{opacity:.55;}
@keyframes cardIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

.card-inner{position:relative;z-index:1;background:var(--bg2);border-radius:17px;padding:16px 12px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;height:100%;}

/* Avatar */
.card-av-wrap{position:relative;width:68px;height:68px;flex-shrink:0;}
.card-av{width:68px;height:68px;border-radius:50%;overflow:hidden;cursor:pointer;
  background:linear-gradient(135deg,var(--blue),var(--purple),var(--pink));
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:900;color:#fff;
  transition:transform .2s,box-shadow .2s;
  box-shadow:0 0 0 2px var(--bg2),0 0 0 3px rgba(79,142,247,.3);}
.card-av:hover{transform:scale(1.08);box-shadow:0 0 0 2px var(--bg2),0 0 12px rgba(79,142,247,.6);}
.card-av img{width:100%;height:100%;object-fit:cover;display:block;}

/* Badges */
.card-badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;}
.badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:50px;white-space:nowrap;}
.bt{background:rgba(79,142,247,.14);border:1px solid rgba(79,142,247,.28);color:var(--blue2);}
.bwc{background:linear-gradient(135deg,rgba(212,175,55,.16),rgba(240,204,80,.1));border:1px solid rgba(212,175,55,.32);color:var(--gold2);font-size:8.5px;}
.bcq{background:rgba(155,93,229,.14);border:1px solid rgba(155,93,229,.28);color:var(--purple);font-size:8.5px;}
.ba{background:rgba(63,214,143,.1);border:1px solid rgba(63,214,143,.22);color:var(--green);}
.br{background:rgba(255,79,110,.08);border:1px solid rgba(255,79,110,.2);color:var(--red);}

.card-name{font-size:13px;font-weight:800;line-height:1.25;color:var(--text);}
.card-country{font-size:11px;color:var(--muted2);}
.card-dob{font-size:10px;color:var(--muted);background:rgba(255,255,255,.04);border-radius:6px;padding:3px 8px;}

/* Admin btns on card */
.card-admin{display:none;position:absolute;top:6px;right:6px;flex-direction:column;gap:3px;z-index:2;}
.card-admin.show{display:flex;}
.ca-btn{background:rgba(5,5,15,.88);border:1px solid rgba(255,255,255,.1);border-radius:6px;color:var(--muted2);font-size:10px;font-weight:700;padding:3px 8px;cursor:pointer;transition:.15s;}
.ca-btn:hover{color:var(--blue2);}
.ca-btn.del:hover{color:var(--red);}

/* STATE */
.state{grid-column:1/-1;text-align:center;padding:70px 20px;}
.state-icon{font-size:52px;margin-bottom:14px;display:block;animation:fp 3s ease-in-out infinite;}
.state h2{font-size:20px;font-weight:700;margin-bottom:6px;}
.state p{color:var(--muted2);font-size:13px;}
.dots{display:flex;gap:7px;justify-content:center;margin:16px 0;}
.dot{width:7px;height:7px;border-radius:50%;animation:dp 1.2s ease-in-out infinite;}
.dot:nth-child(1){background:var(--blue);}.dot:nth-child(2){background:var(--pink);animation-delay:.2s;}.dot:nth-child(3){background:var(--purple);animation-delay:.4s;}
@keyframes dp{0%,80%,100%{opacity:.2;transform:scale(.9);}40%{opacity:1;transform:scale(1.2);}}

/* ── PHOTO LIGHTBOX ── */
.lightbox{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.92);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;}
.lightbox.open{opacity:1;pointer-events:all;}
.lightbox-img{max-width:min(340px,88vw);max-height:340px;border-radius:50%;border:4px solid transparent;background:linear-gradient(var(--bg2),var(--bg2)) padding-box,linear-gradient(135deg,var(--blue),var(--pink),var(--purple)) border-box;object-fit:cover;box-shadow:0 0 60px rgba(79,142,247,.4),0 0 120px rgba(224,64,160,.2);animation:lbIn .3s ease-out;}
.lightbox-init{width:min(280px,80vw);height:min(280px,80vw);border-radius:50%;border:4px solid transparent;background:linear-gradient(135deg,var(--blue),var(--purple),var(--pink)) border-box;display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:900;color:#fff;box-shadow:0 0 60px rgba(79,142,247,.4);}
@keyframes lbIn{from{transform:scale(.7);}to{transform:scale(1);}}
.lightbox-close{position:absolute;top:20px;right:20px;width:40px;height:40px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:50%;color:var(--muted2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
.lightbox-close:hover{color:var(--text);}

/* ── DETAIL MODAL ── */
.ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.85);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s;}
.ov.open{opacity:1;pointer-events:all;}
.modal{background:var(--bg2);border-radius:22px;width:100%;max-width:660px;max-height:92vh;overflow-y:auto;transform:scale(.94) translateY(14px);transition:transform .3s cubic-bezier(.22,1,.36,1);position:relative;}
/* Animated rainbow border on modal */
.modal::before{content:'';position:absolute;inset:-2px;border-radius:24px;z-index:-1;
  background:conic-gradient(from var(--border-angle),#4f8ef7 0%,#9b5de5 25%,#e040a0 50%,#00d4ff 75%,#4f8ef7 100%);
  animation:borderSpin 4s linear infinite;filter:blur(4px);}
.ov.open .modal{transform:scale(1) translateY(0);}

.mhead{position:relative;height:130px;overflow:hidden;border-radius:22px 22px 0 0;}
/* Animated chess board bg in modal header */
.mhead-bg{position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(79,142,247,.15),rgba(224,64,160,.1),rgba(155,93,229,.12));
  animation:mheadShift 6s ease-in-out infinite;}
@keyframes mheadShift{0%,100%{background:linear-gradient(135deg,rgba(79,142,247,.15),rgba(224,64,160,.1));}50%{background:linear-gradient(135deg,rgba(155,93,229,.18),rgba(0,212,255,.1));}}
.mhead-chess{position:absolute;inset:0;background-image:repeating-conic-gradient(rgba(255,255,255,.04) 0% 25%,transparent 0% 50%);background-size:26px 26px;animation:chessDrift 20s linear infinite;}
@keyframes chessDrift{from{background-position:0 0;}to{background-position:52px 52px;}}
.mhead-pieces{position:absolute;inset:0;overflow:hidden;}
.mhp{position:absolute;font-size:22px;opacity:.12;animation:fp var(--fd,12s) ease-in-out infinite;animation-delay:var(--fdl,0s);}
.mclose{position:absolute;top:12px;right:12px;width:32px;height:32px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);border-radius:50%;color:var(--muted2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:1;transition:.15s;}
.mclose:hover{color:var(--text);}

/* Modal avatar — big round with gradient border */
.mav-wrap{position:absolute;bottom:-44px;left:24px;cursor:pointer;}
.mav{width:88px;height:88px;border-radius:50%;border:3px solid transparent;background:linear-gradient(var(--bg2),var(--bg2)) padding-box,linear-gradient(135deg,var(--blue),var(--pink)) border-box;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:var(--blue2);box-shadow:0 4px 24px rgba(79,142,247,.3);transition:transform .2s;background-color:rgba(79,142,247,.14);}
.mav:hover{transform:scale(1.06);}
.mav img{width:100%;height:100%;object-fit:cover;display:block;}

.mbody{padding:54px 26px 26px;}
.mname{font-size:22px;font-weight:900;margin-bottom:6px;}
.mchips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px;}
.chip{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:50px;}
.cb{background:rgba(79,142,247,.12);border:1px solid rgba(79,142,247,.22);color:var(--blue2);}
.cp{background:rgba(224,64,160,.1);border:1px solid rgba(224,64,160,.2);color:var(--pink2);}
.cgr{background:rgba(63,214,143,.09);border:1px solid rgba(63,214,143,.2);color:var(--green);}
.cgy{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:var(--muted2);}
.cgold{background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.22);color:var(--gold);}
.cpurp{background:rgba(155,93,229,.1);border:1px solid rgba(155,93,229,.22);color:var(--purple);}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
@media(max-width:440px){.igrid{grid-template-columns:1fr;}}
.ibox{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);border-radius:var(--r);padding:10px 13px;}
.ibox .il{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.ibox .iv{font-size:13px;font-weight:600;}
.ibox .iv.blue{color:var(--blue2);}
.ibox .iv.gold{color:var(--gold);}
.ibox .iv a{color:var(--blue2);text-decoration:none;}
.ibox .iv a:hover{color:var(--cyan);}
.stitle{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin:14px 0 8px;display:flex;align-items:center;gap:6px;}
.stitle .st{background:linear-gradient(135deg,var(--blue2),var(--pink2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.stitle::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(79,142,247,.25),transparent);}
.wbtn{display:flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(135deg,rgba(79,142,247,.1),rgba(224,64,160,.07));border:1px solid rgba(79,142,247,.22);border-radius:var(--r);padding:9px;color:var(--blue2);font-size:12px;font-weight:700;text-decoration:none;transition:.15s;margin-bottom:10px;}
.wbtn:hover{background:linear-gradient(135deg,rgba(79,142,247,.18),rgba(224,64,160,.13));}
.pgndl{display:flex;flex-direction:column;gap:6px;}
.pgndl a{display:flex;align-items:center;gap:9px;background:linear-gradient(135deg,rgba(79,142,247,.06),rgba(224,64,160,.03));border:1px solid rgba(79,142,247,.14);border-radius:var(--r);padding:9px 12px;color:var(--text);text-decoration:none;transition:.15s;font-size:12px;}
.pgndl a:hover{background:linear-gradient(135deg,rgba(79,142,247,.12),rgba(224,64,160,.07));transform:translateX(3px);}
.pgndl a .pn{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--blue2);}
.pgndl a .pd{background:linear-gradient(135deg,var(--blue2),var(--pink2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-size:16px;}
.desc-box{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:var(--r);padding:12px 15px;}
.desc-box p{font-size:13px;color:var(--muted2);line-height:1.72;}

/* ── LOGIN MODAL ── */
.login-ov{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.9);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .22s;}
.login-ov.open{opacity:1;pointer-events:all;}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:36px 32px;width:100%;max-width:340px;text-align:center;transform:scale(.94);transition:transform .28s cubic-bezier(.22,1,.36,1);}
.login-ov.open .login-box{transform:scale(1);}
.login-box h2{font-size:20px;font-weight:900;margin-bottom:6px;}
.login-box h2 span{background:linear-gradient(135deg,var(--blue2),var(--pink2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.login-box p{font-size:12px;color:var(--muted2);margin-bottom:22px;}
.login-box input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:var(--r);color:var(--text);font-size:15px;padding:12px 14px;outline:none;text-align:center;letter-spacing:5px;margin-bottom:14px;transition:.15s;}
.login-box input:focus{border-color:rgba(79,142,247,.5);}
.btn-login{width:100%;background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;font-size:14px;font-weight:900;border:none;border-radius:var(--r);padding:12px;cursor:pointer;transition:.15s;}
.btn-login:hover{transform:translateY(-1px);}
.login-err{font-size:12px;color:var(--red);margin-top:10px;min-height:18px;}

/* ── EDIT MODAL ── */
.edit-ov{position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.88);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .22s;}
.edit-ov.open{opacity:1;pointer-events:all;}
.edit-box{background:var(--bg2);border:1px solid var(--border);border-radius:20px;width:100%;max-width:680px;max-height:92vh;overflow-y:auto;transform:scale(.94) translateY(14px);transition:transform .3s cubic-bezier(.22,1,.36,1);}
.edit-ov.open .edit-box{transform:scale(1) translateY(0);}
.edit-head{padding:22px 26px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.edit-head h2{font-size:18px;font-weight:900;}
.edit-head h2 span{background:linear-gradient(135deg,var(--blue2),var(--pink2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.edit-body{padding:0 26px 26px;}
.ef{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.ef label{font-size:11px;font-weight:700;color:var(--muted2);}
.ef input,.ef select,.ef textarea{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:var(--r);color:var(--text);font-size:13px;padding:9px 12px;outline:none;width:100%;transition:.15s;font-family:inherit;}
.ef input:focus,.ef select:focus,.ef textarea:focus{border-color:rgba(79,142,247,.5);}
.ef textarea{resize:vertical;min-height:80px;line-height:1.6;}
.ef select option{background:#0d0d1f;}
.eg2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:480px){.eg2{grid-template-columns:1fr;}}
.toggle-row{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--muted2);}
.toggle-row input{width:15px;height:15px;accent-color:var(--blue);}
.edit-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:16px;}
.btn-eu{background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;font-size:13px;font-weight:900;border:none;border-radius:var(--r);padding:10px 24px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:7px;}
.btn-eu:hover{transform:translateY(-1px);}
.btn-eu .spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none;}
.btn-eu.saving .spin{display:block;}
.btn-cancel{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:var(--muted2);font-size:12px;font-weight:600;padding:10px 18px;border-radius:var(--r);cursor:pointer;transition:.15s;}
.btn-cancel:hover{color:var(--text);}
@keyframes spin{to{transform:rotate(360deg);}}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);border-radius:50px;padding:10px 22px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.ok{background:rgba(63,214,143,.12);border:1px solid rgba(63,214,143,.28);color:var(--green);}
.toast.err{background:rgba(255,79,110,.1);border:1px solid rgba(255,79,110,.28);color:var(--red);}

::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:rgba(79,142,247,.2);border-radius:3px;}
</style>
</head>
<body>
<div class="bg-orbs">
  <div class="orb orb1" style="--od:22s;"></div>
  <div class="orb orb2" style="--od:18s;--odl:4s;"></div>
  <div class="orb orb3" style="--od:26s;--odl:9s;"></div>
</div>
<div class="pieces-bg" id="piecesBg"></div>

<nav>
  <a class="brand" href="legendchessplayer.html">
    <span class="icon">♛</span><span>Chess Legends</span>
  </a>
  <div class="nav-right">
    <div class="admin-badge" id="adminBadge">
      <span>🔐 Admin Mode</span>
      <button class="btn-logout" onclick="logoutAdmin()">Logout</button>
    </div>
    <button class="btn-admin-login" id="adminBtn" onclick="openLogin()">🔐 Admin</button>
  </div>
</nav>

<div class="hero">
  <div class="hero-badge"><span>📚 Study Material · Chess Legends</span></div>
  <h1>Hall of <span class="g">Fame</span></h1>
  <p id="heroSub">Loading legendary chess players…</p>
</div>

<div class="stats-bar" id="statsBar"></div>

<div class="filters">
  <div class="search-box"><input type="text" id="qInput" placeholder="Search name or country…" oninput="applyFilters()"/></div>
  <select class="fsel" id="fCountry" onchange="applyFilters()"><option value="">All Countries</option></select>
  <select class="fsel" id="fTitle"   onchange="applyFilters()"><option value="">All Titles</option></select>
  <button class="fbtn" id="btnC" onclick="toggleF('champ')">♛ Champions</button>
  <button class="fbtn" id="btnA" onclick="toggleF('active')">✅ Active</button>
</div>

<div class="grid" id="grid">
  <div class="state">
    <span class="state-icon">♞</span><h2>Loading Legends</h2>
    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>
</div>

<!-- Photo Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <div id="lightboxContent"></div>
</div>

<!-- Detail Modal -->
<div class="ov" id="detailOv" onclick="closeDetail(event)">
  <div class="modal" id="modalBox">
    <div class="mhead">
      <div class="mhead-bg"></div>
      <div class="mhead-chess"></div>
      <div class="mhead-pieces" id="mheadPieces"></div>
      <button class="mclose" onclick="closeDetailDirect()">✕</button>
      <div class="mav-wrap" id="mavWrap">
        <div class="mav" id="mAv"></div>
      </div>
    </div>
    <div class="mbody" id="mBody"></div>
  </div>
</div>

<!-- Login Modal -->
<div class="login-ov" id="loginOv" onclick="closeLoginOv(event)">
  <div class="login-box">
    <h2>Admin <span>Login</span></h2>
    <p>Enter password to manage legends</p>
    <input type="password" id="pwInput" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="btn-login" onclick="doLogin()">🔐 Login</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- Edit Modal -->
<div class="edit-ov" id="editOv" onclick="closeEditOv(event)">
  <div class="edit-box">
    <div class="edit-head">
      <h2>Edit <span id="editTitle">Player</span></h2>
      <button class="mclose" onclick="closeEditDirect()">✕</button>
    </div>
    <div class="edit-body">
      <div class="eg2">
        <div class="ef"><label>Full Name</label><input id="ef-name" type="text" maxlength="100"/></div>
        <div class="ef"><label>Title</label>
          <select id="ef-title">
            <option>GM</option><option>IM</option><option>FM</option><option>CM</option>
            <option>WGM</option><option>WIM</option><option>WFM</option><option>WCM</option>
            <option>NM</option><option>Untitled</option>
          </select>
        </div>
      </div>
      <div class="eg2">
        <div class="ef"><label>Country</label><input id="ef-country" type="text"/></div>
        <div class="ef"><label>FIDE ID</label><input id="ef-fide" type="text" oninput="this.value=this.value.replace(/\D/g,'')"/></div>
      </div>
      <div class="eg2">
        <div class="ef"><label>Date of Birth (YYYY-MM-DD)</label><input id="ef-dob" type="date"/></div>
        <div class="ef"><label>Date of Death (YYYY-MM-DD)</label><input id="ef-dod" type="date"/></div>
      </div>
      <div class="eg2">
        <div class="ef"><label>Peak Rating</label><input id="ef-rating" type="number" min="1000" max="3500"/></div>
        <div class="ef"><label>Wikipedia URL</label><input id="ef-wiki" type="url"/></div>
      </div>
      <div class="eg2">
        <div class="ef"><label>Championship Years</label><input id="ef-champ-years" type="text" placeholder="2014,2016,2018"/></div>
        <div class="ef"><label>Championship Format</label><input id="ef-champ-format" type="text" placeholder="std,rapid"/></div>
      </div>
      <div class="eg2">
        <div class="ef"><label>Candidates Years</label><input id="ef-cand-years" type="text" placeholder="2013,2016"/></div>
        <div class="ef" style="justify-content:flex-end;padding-top:20px;">
          <label class="toggle-row"><input type="checkbox" id="ef-champion"/> ♛ World Champion</label>
          <label class="toggle-row" style="margin-top:8px;"><input type="checkbox" id="ef-candidate"/> 🏆 Candidate Qualifier</label>
          <label class="toggle-row" style="margin-top:8px;"><input type="checkbox" id="ef-active"/> ✅ Active</label>
        </div>
      </div>
      <div class="ef"><label>Description</label><textarea id="ef-description" style="min-height:90px;"></textarea></div>
      <div class="edit-actions">
        <button class="btn-cancel" onclick="closeEditDirect()">Cancel</button>
        <button class="btn-eu" id="btnUpdate" onclick="updatePlayer()">
          <span class="spin"></span><span>💾 Update Player</span>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyBXrHcMJzQn3cxutg41LZs9oYwEfALe00s",
  authDomain:"ratedeventsgj.firebaseapp.com",
  projectId:"ratedeventsgj",
  storageBucket:"ratedeventsgj.firebasestorage.app",
  messagingSenderId:"527826897689",
  appId:"1:527826897689:web:fb0439fff04a695a599388"
});
const db = getFirestore(app);

const ADMIN_PASS = "radmin";
let all=[], showChamp=false, showActive=false, isAdmin=false, editingId=null;

/* Floating pieces */
(function(){
  const p=["♔","♕","♖","♗","♘","♙","♚","♛","♜","♝","♞","♟"];
  const c=["#4f8ef7","#e040a0","#9b5de5","#00d4ff","#f0cc50","#ff6ec7"];
  const bg=document.getElementById("piecesBg");
  p.forEach((ch,i)=>{
    const d=document.createElement("div");d.className="fpiece";d.textContent=ch;
    d.style.cssText=`left:${(i*8.3)%97}%;top:${(i*11.7)%93}%;--fd:${10+i*1.3}s;--fdl:${i*0.55}s;--fs:${18+Math.random()*26}px;color:${c[i%c.length]};`;
    bg.appendChild(d);
  });
})();

function ini(n){return(n||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();}
function fmt(d){if(!d)return"—";return new Date(d+"T00:00:00").toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});}
function photoSrc(p){return p.photoBase64||p.photoURL||"";}

/* Sort by DOB ascending */
function sortByDOB(arr){
  return [...arr].sort((a,b)=>{
    if(!a.dob) return 1;if(!b.dob) return -1;
    return new Date(a.dob)-new Date(b.dob);
  });
}

/* Live data */
onSnapshot(query(collection(db,"legendplayerdb"),orderBy("createdAt","asc")), snap=>{
  all=snap.docs.map(d=>({id:d.id,...d.data()}));
  buildFilters();renderStats();applyFilters();
  document.getElementById("heroSub").textContent=`${all.length} legendary grandmaster${all.length!==1?"s":""}`;
},err=>{
  document.getElementById("grid").innerHTML=`<div class="state"><span class="state-icon">⚠️</span><h2>Error</h2><p>${err.message}</p></div>`;
});

function buildFilters(){
  const cs=[...new Set(all.map(p=>p.country).filter(Boolean))].sort();
  const ts=[...new Set(all.map(p=>p.title).filter(Boolean))].sort();
  document.getElementById("fCountry").innerHTML=`<option value="">All Countries</option>`+cs.map(c=>`<option>${c}</option>`).join("");
  document.getElementById("fTitle").innerHTML=`<option value="">All Titles</option>`+ts.map(t=>`<option>${t}</option>`).join("");
}
function renderStats(){
  const ch=all.filter(p=>p.worldChampion).length;
  const co=[...new Set(all.map(p=>p.country))].length;
  const ac=all.filter(p=>p.active).length;
  const colors=["var(--blue2)","var(--gold2)","var(--pink2)","var(--green)"];
  document.getElementById("statsBar").innerHTML=
    [[all.length,"Total"],[ch,"Champions"],[co,"Countries"],[ac,"Active"]]
    .map(([v,l],i)=>`<div><div class="sv" style="color:${colors[i]}">${v}</div><div class="sl">${l}</div></div>`).join("");
}

window.applyFilters=function(){
  const q=document.getElementById("qInput").value.toLowerCase();
  const c=document.getElementById("fCountry").value;
  const t=document.getElementById("fTitle").value;
  const filtered=all.filter(p=>
    (!q||(p.name||"").toLowerCase().includes(q)||(p.country||"").toLowerCase().includes(q))
    &&(!c||p.country===c)&&(!t||p.title===t)
    &&(!showChamp||p.worldChampion)&&(!showActive||p.active));
  renderGrid(sortByDOB(filtered));
};
window.toggleF=function(key){
  if(key==="champ"){showChamp=!showChamp;document.getElementById("btnC").classList.toggle("on",showChamp);}
  else{showActive=!showActive;document.getElementById("btnA").classList.toggle("on",showActive);}
  applyFilters();
};

function renderGrid(players){
  const g=document.getElementById("grid");
  if(!players.length){
    g.innerHTML=`<div class="state"><span class="state-icon">♟</span><h2>No Players Found</h2><p>Try adjusting your filters</p></div>`;return;
  }
  g.innerHTML=players.map((p,i)=>{
    const src=photoSrc(p);
    const avHTML=src
      ?`<img src="${src}" alt="${p.name}" onerror="this.style.display='none';this.parentElement.innerHTML='<span>${ini(p.name)}</span>'">`
      :`<span>${ini(p.name)}</span>`;
    return`<div class="card" style="animation-delay:${i*.04}s">
      <div class="card-inner">
        <div class="card-admin ${isAdmin?"show":""}" id="ab-${p.id}">
          <button class="ca-btn" onclick="event.stopPropagation();openEdit('${p.id}')">✏️ Edit</button>
          <button class="ca-btn del" onclick="event.stopPropagation();deletePlayer('${p.id}','${(p.name||"").replace(/'/g,"\\'")}')">🗑 Delete</button>
        </div>
        <div class="card-av-wrap">
          <div class="card-av" onclick="event.stopPropagation();openLightbox('${p.id}')">${avHTML}</div>
        </div>
        <div class="card-badges">
          <span class="badge bt">${p.title||"GM"}</span>
          ${p.worldChampion?`<span class="badge bwc">World Champion</span>`:""}
          ${p.candidateQualifier?`<span class="badge bcq">Candidate</span>`:""}
          ${p.active?`<span class="badge ba">Active</span>`:`<span class="badge br">Retired</span>`}
        </div>
        <div class="card-name">${p.name||"—"}</div>
        <div class="card-country">${p.country||""}</div>
        <div class="card-dob">${fmt(p.dob)}</div>
      </div>
    </div>`;
  }).join("");
  /* attach click on card-inner (not av) */
  g.querySelectorAll(".card").forEach(el=>{
    el.addEventListener("click",()=>openDetail(el.querySelector(".card-name").textContent));
  });
  /* re-attach with id */
  players.forEach((p,i)=>{
    const cards=g.querySelectorAll(".card");
    if(cards[i]) cards[i].addEventListener("click",()=>openDetail(p.id));
  });
  /* fix: clear double-listeners by using data-id */
  g.querySelectorAll(".card").forEach((el,i)=>{
    el.onclick=null;
    el.dataset.idx=i;
  });
  g.querySelectorAll(".card").forEach((el,i)=>{
    el.addEventListener("click",function(e){
      if(e.target.closest(".card-admin")||e.target.closest(".card-av")) return;
      openDetail(players[i].id);
    });
  });
}

/* Photo lightbox */
window.openLightbox=function(id){
  const p=all.find(x=>x.id===id);if(!p) return;
  const src=photoSrc(p);
  const lb=document.getElementById("lightboxContent");
  if(src){
    lb.innerHTML=`<img class="lightbox-img" src="${src}" alt="${p.name}"/>`;
  }else{
    lb.innerHTML=`<div class="lightbox-init"><span>${ini(p.name)}</span></div>`;
  }
  document.getElementById("lightbox").classList.add("open");
  document.body.style.overflow="hidden";
};
window.closeLightbox=function(){
  document.getElementById("lightbox").classList.remove("open");
  document.body.style.overflow="";
};

/* Detail modal */
window.openDetail=function(id){
  const p=all.find(x=>x.id===id);if(!p) return;
  const src=photoSrc(p);

  /* Animated header pieces */
  const pieces=["♔","♕","♖","♗","♘","♙","♚","♛","♜","♝","♞","♟"];
  const colors=["#4f8ef7","#e040a0","#9b5de5","#00d4ff","#f0cc50","#ff6ec7"];
  document.getElementById("mheadPieces").innerHTML=pieces.slice(0,8).map((ch,i)=>
    `<div class="mhp" style="left:${8+i*12}%;top:${20+Math.sin(i)*30}%;--fd:${8+i*1.2}s;--fdl:${i*0.4}s;color:${colors[i%colors.length]}">${ch}</div>`
  ).join("");

  /* Avatar */
  const mav=document.getElementById("mAv");
  if(src){
    mav.innerHTML=`<img src="${src}" alt="${p.name}" onerror="this.style.display='none';this.parentElement.innerHTML='<span>${ini(p.name)}</span>'">`;
  }else{
    mav.innerHTML=`<span>${ini(p.name)}</span>`;
  }
  /* Click avatar in modal → lightbox */
  document.getElementById("mavWrap").onclick=()=>openLightbox(id);

  const fideLink=p.fideId
    ?`<a href="https://ratings.fide.com/profile/${p.fideId}" target="_blank" rel="noopener">${p.fideId} ↗</a>`
    :"—";

  const notable=p.notableGames||[];
  const games=p.gamesCollection||[];

  function pgnSection(arr,label){
    if(!arr.length) return "";
    return`<div class="stitle"><span class="st">${label}</span></div>
    <div class="pgndl">${arr.map(g=>{
      const blob=new Blob([g.content||""],{type:"application/x-chess-pgn"});
      const url=URL.createObjectURL(blob);
      return`<a href="${url}" download="${g.name}">
        <span style="font-size:15px;flex-shrink:0">♟</span>
        <span class="pn">${g.name}</span>
        <span style="font-size:11px;color:var(--muted2);flex-shrink:0">${g.size?(g.size/1024).toFixed(1)+" KB":""}</span>
        <span class="pd">⬇</span></a>`;
    }).join("")}</div>`;
  }

  document.getElementById("mBody").innerHTML=`
    <div class="mname">${p.name}</div>
    <div class="mchips">
      <span class="chip cb">${p.title||"GM"}</span>
      ${p.worldChampion?`<span class="chip cgold">♛ World Champion</span>`:""}
      ${p.candidateQualifier?`<span class="chip cpurp">🏆 Candidate Qualifier</span>`:""}
      ${p.active?`<span class="chip cgr">Active</span>`:`<span class="chip cgy">Retired</span>`}
      <span class="chip cgy">${p.country||""}</span>
    </div>
    <div class="igrid">
      <div class="ibox"><div class="il">Date of Birth</div><div class="iv blue">${fmt(p.dob)}</div></div>
      ${p.dod?`<div class="ibox"><div class="il">Date of Death</div><div class="iv">${fmt(p.dod)}</div></div>`:""}
      ${p.peakRating?`<div class="ibox"><div class="il">Peak Rating</div><div class="iv gold">${p.peakRating}</div></div>`:""}
      <div class="ibox"><div class="il">FIDE ID</div><div class="iv blue">${fideLink}</div></div>
      ${p.champYears?`<div class="ibox"><div class="il">Championship Years</div><div class="iv">${p.champYears}</div></div>`:""}
      ${p.champFormat?`<div class="ibox"><div class="il">Format</div><div class="iv">${p.champFormat}</div></div>`:""}
      ${p.candidateYears?`<div class="ibox"><div class="il">Candidate Years</div><div class="iv">${p.candidateYears}</div></div>`:""}
    </div>
    ${p.wikipedia?`<a class="wbtn" href="${p.wikipedia}" target="_blank" rel="noopener">📖 View on Wikipedia</a>`:""}
    ${pgnSection(notable,"♟ Notable Games Collection")}
    ${pgnSection(games,"♗ Chess Games Collection")}
    ${p.description?`<div class="stitle"><span class="st">📝 Description</span></div><div class="desc-box"><p>${p.description.replace(/\n/g,"<br/>")}</p></div>`:""}`;

  document.getElementById("detailOv").classList.add("open");
  document.body.style.overflow="hidden";
};
window.closeDetail=function(e){if(e.target===document.getElementById("detailOv")) closeDetailDirect();};
window.closeDetailDirect=function(){document.getElementById("detailOv").classList.remove("open");document.body.style.overflow="";};

/* Admin */
window.openLogin=function(){document.getElementById("loginOv").classList.add("open");setTimeout(()=>document.getElementById("pwInput").focus(),200);};
window.closeLoginOv=function(e){if(e.target===document.getElementById("loginOv")) document.getElementById("loginOv").classList.remove("open");};
window.doLogin=function(){
  const pw=document.getElementById("pwInput").value;
  if(pw===ADMIN_PASS){
    isAdmin=true;
    document.getElementById("loginOv").classList.remove("open");
    document.getElementById("adminBadge").classList.add("show");
    document.getElementById("adminBtn").style.display="none";
    document.getElementById("pwInput").value="";
    document.getElementById("loginErr").textContent="";
    applyFilters();toast("✅ Admin access granted","ok");
  }else{
    document.getElementById("loginErr").textContent="❌ Wrong password";
    document.getElementById("pwInput").value="";
  }
};
window.logoutAdmin=function(){
  isAdmin=false;
  document.getElementById("adminBadge").classList.remove("show");
  document.getElementById("adminBtn").style.display="block";
  applyFilters();toast("Logged out","ok");
};
window.deletePlayer=async function(id,name){
  if(!confirm(`Delete "${name}"? Cannot be undone.`)) return;
  try{await deleteDoc(doc(db,"legendplayerdb",id));toast(`🗑 "${name}" deleted`,"ok");}
  catch(e){toast("❌ "+e.message,"err");}
};
window.openEdit=function(id){
  const p=all.find(x=>x.id===id);if(!p) return;
  editingId=id;
  document.getElementById("editTitle").textContent=p.name||"Player";
  document.getElementById("ef-name").value=p.name||"";
  document.getElementById("ef-title").value=p.title||"GM";
  document.getElementById("ef-country").value=p.country||"";
  document.getElementById("ef-fide").value=p.fideId||"";
  document.getElementById("ef-rating").value=p.peakRating||"";
  document.getElementById("ef-dob").value=p.dob||"";
  document.getElementById("ef-dod").value=p.dod||"";
  document.getElementById("ef-wiki").value=p.wikipedia||"";
  document.getElementById("ef-champion").checked=!!p.worldChampion;
  document.getElementById("ef-candidate").checked=!!p.candidateQualifier;
  document.getElementById("ef-active").checked=p.active!==false;
  document.getElementById("ef-champ-years").value=p.champYears||"";
  document.getElementById("ef-champ-format").value=p.champFormat||"";
  document.getElementById("ef-cand-years").value=p.candidateYears||"";
  document.getElementById("ef-description").value=p.description||"";
  document.getElementById("editOv").classList.add("open");
  document.body.style.overflow="hidden";
};
window.closeEditOv=function(e){if(e.target===document.getElementById("editOv")) closeEditDirect();};
window.closeEditDirect=function(){document.getElementById("editOv").classList.remove("open");document.body.style.overflow="";editingId=null;};
window.updatePlayer=async function(){
  if(!editingId) return;
  const btn=document.getElementById("btnUpdate");
  btn.disabled=true;btn.classList.add("saving");
  try{
    await updateDoc(doc(db,"legendplayerdb",editingId),{
      name:             document.getElementById("ef-name").value.trim(),
      title:            document.getElementById("ef-title").value,
      country:          document.getElementById("ef-country").value.trim(),
      fideId:           document.getElementById("ef-fide").value.trim()||null,
      peakRating:       parseInt(document.getElementById("ef-rating").value)||null,
      dob:              document.getElementById("ef-dob").value,
      dod:              document.getElementById("ef-dod").value||null,
      wikipedia:        document.getElementById("ef-wiki").value.trim()||null,
      worldChampion:    document.getElementById("ef-champion").checked,
      candidateQualifier:document.getElementById("ef-candidate").checked,
      active:           document.getElementById("ef-active").checked,
      champYears:       document.getElementById("ef-champ-years").value.trim()||null,
      champFormat:      document.getElementById("ef-champ-format").value.trim()||null,
      candidateYears:   document.getElementById("ef-cand-years").value.trim()||null,
      description:      document.getElementById("ef-description").value.trim()||null,
    });
    toast("✅ Player updated","ok");closeEditDirect();
  }catch(e){toast("❌ "+e.message,"err");}
  finally{btn.disabled=false;btn.classList.remove("saving");}
};

/* Toast */
let tt=null;
window.toast=function(msg,type="ok"){
  const el=document.getElementById("toast");
  el.textContent=msg;el.className=`toast show ${type}`;
  clearTimeout(tt);tt=setTimeout(()=>el.className="toast",2800);
};
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    closeDetailDirect();closeEditDirect();closeLightbox();
    document.getElementById("loginOv").classList.remove("open");
  }
});
</script>
