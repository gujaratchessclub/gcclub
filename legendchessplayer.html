<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chess Legends — Hall of Fame</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --gold:#d4af37;--gold2:#f0cc50;
  --bg:#07070e;--bg2:#0f0f1c;
  --glass:rgba(255,255,255,0.04);
  --border:rgba(212,175,55,0.18);
  --text:#e8e8f0;--muted:#6b6b8a;--muted2:#8a8aa8;
  --red:#e05555;--green:#4caf7d;
  --r:12px;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:repeating-conic-gradient(rgba(212,175,55,.02) 0% 25%,transparent 0% 50%);background-size:52px 52px;}
.pieces-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.piece{position:absolute;color:var(--gold);opacity:.045;font-size:clamp(18px,3vw,44px);user-select:none;animation:float var(--d,12s) ease-in-out infinite;animation-delay:var(--dl,0s);}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-20px) rotate(4deg);}}

nav{position:sticky;top:0;z-index:100;background:rgba(7,7,14,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 clamp(16px,4vw,36px);height:60px;display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;}
.brand .crown{color:var(--gold);font-size:24px;}
.brand b{color:var(--gold);}
.nav-links{display:flex;gap:4px;}
.nav-links a{color:var(--muted2);text-decoration:none;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;transition:.15s;}
.nav-links a:hover{color:var(--text);background:rgba(255,255,255,.05);}
.nav-links a.active{color:#000;background:var(--gold);}

.hero{position:relative;z-index:1;text-align:center;padding:clamp(36px,6vw,64px) 20px 20px;}
.hero-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.28);border-radius:50px;padding:5px 16px;font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.7px;text-transform:uppercase;margin-bottom:14px;animation:fadeD .6s ease-out;}
.hero h1{font-size:clamp(26px,5vw,50px);font-weight:900;line-height:1.1;margin-bottom:8px;animation:fadeD .7s ease-out;}
.hero h1 span{background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero p{color:var(--muted2);font-size:14px;animation:fadeD .8s ease-out;}
@keyframes fadeD{from{opacity:0;transform:translateY(-12px);}to{opacity:1;transform:translateY(0);}}

.stats-bar{position:relative;z-index:1;display:flex;justify-content:center;gap:clamp(20px,5vw,56px);padding:16px 20px 24px;flex-wrap:wrap;}
.sv{font-size:26px;font-weight:900;color:var(--gold);line-height:1;}
.sl{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.5px;}

.filters{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding:0 clamp(12px,3vw,24px) 16px;display:flex;gap:8px;flex-wrap:wrap;}
.search-box{flex:1;min-width:200px;position:relative;}
.search-box input{width:100%;background:var(--glass);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:13px;padding:9px 14px 9px 38px;outline:none;transition:.15s;}
.search-box input:focus{border-color:rgba(212,175,55,.45);}
.search-box::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;}
.fsel{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:12px;padding:9px 12px;outline:none;cursor:pointer;}
.fsel option{background:#1a1a2e;}
.fbtn{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);color:var(--muted2);font-size:12px;font-weight:600;padding:9px 14px;cursor:pointer;transition:.15s;}
.fbtn:hover,.fbtn.on{color:var(--gold);border-color:rgba(212,175,55,.35);background:rgba(212,175,55,.07);}

.grid{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding:0 clamp(12px,3vw,24px) 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;}

.card{background:var(--glass);border:1px solid var(--border);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;animation:cardIn .35s ease-out backwards;}
.card:hover{transform:translateY(-4px);border-color:rgba(212,175,55,.32);box-shadow:0 14px 40px rgba(212,175,55,.07);}
@keyframes cardIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.card-top{position:relative;height:100px;background:linear-gradient(135deg,rgba(212,175,55,.07),rgba(212,175,55,.02));}
.card-board{position:absolute;inset:0;background-image:repeating-conic-gradient(rgba(212,175,55,.055) 0% 25%,transparent 0% 50%);background-size:20px 20px;}
.card-av{position:absolute;bottom:-32px;left:18px;width:66px;height:66px;border-radius:50%;border:3px solid var(--bg);background:rgba(212,175,55,.14);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:var(--gold);overflow:hidden;box-shadow:0 3px 16px rgba(0,0,0,.5);}
.card-av img{width:100%;height:100%;object-fit:cover;display:block;}
.card-bgs{position:absolute;top:10px;right:10px;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:50px;}
.bt{background:rgba(212,175,55,.18);border:1px solid rgba(212,175,55,.28);color:var(--gold);}
.bc{background:rgba(212,175,55,.22);border:1px solid rgba(212,175,55,.38);color:var(--gold2);}
.ba{background:rgba(76,175,125,.13);border:1px solid rgba(76,175,125,.28);color:var(--green);}
.card-body{padding:42px 18px 16px;}
.card-name{font-size:17px;font-weight:800;margin-bottom:2px;}
.card-country{font-size:12px;color:var(--muted2);margin-bottom:10px;}
.card-meta{display:flex;gap:14px;flex-wrap:wrap;}
.mi .ml{color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;display:block;}
.mi .mv{font-size:12px;font-weight:600;}.mi .mv.g{color:var(--gold);font-weight:800;}
.card-foot{padding:0 18px 14px;border-top:1px solid rgba(255,255,255,.05);padding-top:10px;display:flex;justify-content:space-between;align-items:center;}
.pgn-pill{font-size:10.5px;background:rgba(212,175,55,.07);border:1px solid rgba(212,175,55,.16);border-radius:50px;padding:3px 9px;color:var(--gold);}

/* Modal */
.ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.82);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s;}
.ov.open{opacity:1;pointer-events:all;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:22px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;transform:scale(.95) translateY(14px);transition:transform .3s cubic-bezier(.22,1,.36,1);}
.ov.open .modal{transform:scale(1) translateY(0);}
.mhead{position:relative;height:140px;background:linear-gradient(135deg,rgba(212,175,55,.1),rgba(212,175,55,.03));overflow:hidden;}
.mboard{position:absolute;inset:0;background-image:repeating-conic-gradient(rgba(212,175,55,.06) 0% 25%,transparent 0% 50%);background-size:28px 28px;}
.mclose{position:absolute;top:12px;right:12px;width:34px;height:34px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);border-radius:50%;color:var(--muted2);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;z-index:1;}
.mclose:hover{color:var(--text);}
.mav{position:absolute;bottom:-38px;left:24px;width:76px;height:76px;border-radius:50%;border:4px solid var(--bg2);background:rgba(212,175,55,.14);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:var(--gold);overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.6);}
.mav img{width:100%;height:100%;object-fit:cover;}
.mbody{padding:50px 26px 26px;}
.mname{font-size:22px;font-weight:900;margin-bottom:6px;}
.mchips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:18px;}
.chip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:50px;}
.cg{background:rgba(212,175,55,.11);border:1px solid rgba(212,175,55,.23);color:var(--gold);}
.cgr{background:rgba(76,175,125,.09);border:1px solid rgba(76,175,125,.22);color:var(--green);}
.cgy{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);color:var(--muted2);}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
@media(max-width:440px){.igrid{grid-template-columns:1fr;}}
.ibox{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);border-radius:var(--r);padding:10px 13px;}
.ibox .il{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.ibox .iv{font-size:13.5px;font-weight:600;}.ibox .iv.g{color:var(--gold);}
.stitle{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--gold);margin:16px 0 8px;display:flex;align-items:center;gap:7px;}
.stitle::after{content:'';flex:1;height:1px;background:rgba(212,175,55,.12);}
.wbtn{display:flex;align-items:center;justify-content:center;gap:7px;background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.2);border-radius:var(--r);padding:9px;color:var(--gold);font-size:12.5px;font-weight:700;text-decoration:none;transition:.15s;margin-bottom:12px;}
.wbtn:hover{background:rgba(212,175,55,.15);}
.pgndl{display:flex;flex-direction:column;gap:6px;}
.pgndl a{display:flex;align-items:center;gap:10px;background:rgba(212,175,55,.05);border:1px solid rgba(212,175,55,.13);border-radius:var(--r);padding:9px 12px;color:var(--text);text-decoration:none;transition:.15s;font-size:12px;}
.pgndl a:hover{background:rgba(212,175,55,.1);transform:translateX(3px);}
.pgndl a .pn{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pgndl a .ps{color:var(--muted2);flex-shrink:0;}
.pgndl a .pd{color:var(--gold);font-size:16px;flex-shrink:0;}

/* State boxes */
.state{grid-column:1/-1;text-align:center;padding:72px 20px;}
.state-icon{font-size:52px;margin-bottom:14px;display:block;animation:float 3s ease-in-out infinite;}
.state h2{font-size:20px;font-weight:700;margin-bottom:6px;}
.state p{color:var(--muted2);font-size:13px;}
.dots{display:flex;gap:7px;justify-content:center;margin:16px 0;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:dp 1.2s ease-in-out infinite;}
.dot:nth-child(2){animation-delay:.2s;}.dot:nth-child(3){animation-delay:.4s;}
@keyframes dp{0%,80%,100%{opacity:.2;transform:scale(.9);}40%{opacity:1;transform:scale(1.2);}}

::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:rgba(212,175,55,.18);border-radius:3px;}
</style>
</head>
<body>

<div class="pieces-bg" id="piecesBg"></div>

<nav>
  <div class="brand"><span class="crown">♛</span><span><b>Chess</b>Birthday</span></div>
  <div class="nav-links">
    <a href="legendchessplayerform.html">+ Add Legend</a>
    <a href="legendchessplayer.html" class="active">View Legends</a>
    <a href="chessbornmatch.html">Birthday Match</a>
  </div>
</nav>

<div class="hero">
  <div class="hero-badge">♛ Hall of Fame</div>
  <h1>Chess <span>Legends</span></h1>
  <p id="heroSub">Loading legendary players…</p>
</div>

<div class="stats-bar" id="statsBar"></div>

<div class="filters">
  <div class="search-box"><input type="text" id="qInput" placeholder="Search name or country…" oninput="applyFilters()"/></div>
  <select class="fsel" id="fCountry" onchange="applyFilters()"><option value="">All Countries</option></select>
  <select class="fsel" id="fTitle"   onchange="applyFilters()"><option value="">All Titles</option></select>
  <button class="fbtn" id="btnC" onclick="toggle('champ')">♛ Champions</button>
  <button class="fbtn" id="btnA" onclick="toggle('active')">✅ Active</button>
</div>

<div class="grid" id="grid">
  <div class="state">
    <span class="state-icon">♞</span><h2>Loading Legends</h2>
    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>
</div>

<!-- Modal -->
<div class="ov" id="ov" onclick="closeMod(event)">
  <div class="modal">
    <div class="mhead"><div class="mboard"></div>
      <button class="mclose" onclick="closeModDirect()">✕</button>
      <div class="mav" id="mAv"></div>
    </div>
    <div class="mbody" id="mBody"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyBXrHcMJzQn3cxutg41LZs9oYwEfALe00s",
  authDomain:"ratedeventsgj.firebaseapp.com",
  projectId:"ratedeventsgj",
  storageBucket:"ratedeventsgj.firebasestorage.app",
  messagingSenderId:"527826897689",
  appId:"1:527826897689:web:fb0439fff04a695a599388"
});
const db = getFirestore(app);

let all=[], showChamp=false, showActive=false;

/* Pieces */
(function(){
  const p=["♔","♕","♖","♗","♘","♙","♚","♛","♜","♝","♞","♟"];
  const bg=document.getElementById("piecesBg");
  p.forEach((ch,i)=>{
    const d=document.createElement("div");d.className="piece";d.textContent=ch;
    d.style.cssText=`left:${(i*8.5)%98}%;top:${(i*13.7)%95}%;font-size:${18+Math.random()*32}px;--d:${9+i*1.3}s;--dl:${i*0.55}s;`;
    bg.appendChild(d);
  });
})();

function ini(n){return(n||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();}
function fmt(d){if(!d)return"—";return new Date(d+"T00:00:00").toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});}
/* get photo src — supports both photoBase64 (new) and photoURL (legacy) */
function photoSrc(p){return p.photoBase64||p.photoURL||"";}

/* Live data */
onSnapshot(query(collection(db,"legendplayerdb"),orderBy("createdAt","desc")), snap=>{
  all=snap.docs.map(d=>({id:d.id,...d.data()}));
  buildFilters(); renderStats(); applyFilters();
  document.getElementById("heroSub").textContent=`${all.length} legendary grandmaster${all.length!==1?"s":""}`;
}, err=>{
  document.getElementById("grid").innerHTML=`<div class="state"><span class="state-icon">⚠️</span><h2>Error</h2><p>${err.message}</p></div>`;
});

function buildFilters(){
  const cs=[...new Set(all.map(p=>p.country).filter(Boolean))].sort();
  const ts=[...new Set(all.map(p=>p.title).filter(Boolean))].sort();
  document.getElementById("fCountry").innerHTML=`<option value="">All Countries</option>`+cs.map(c=>`<option>${c}</option>`).join("");
  document.getElementById("fTitle").innerHTML  =`<option value="">All Titles</option>`  +ts.map(t=>`<option>${t}</option>`).join("");
}
function renderStats(){
  const ch=all.filter(p=>p.worldChampion).length;
  const co=[...new Set(all.map(p=>p.country))].length;
  const ac=all.filter(p=>p.active).length;
  document.getElementById("statsBar").innerHTML=
    [[all.length,"Total"],[ch,"Champions"],[co,"Countries"],[ac,"Active"]]
    .map(([v,l])=>`<div><div class="sv">${v}</div><div class="sl">${l}</div></div>`).join("");
}

window.applyFilters=function(){
  const q=document.getElementById("qInput").value.toLowerCase();
  const c=document.getElementById("fCountry").value;
  const t=document.getElementById("fTitle").value;
  const f=all.filter(p=>
    (!q||(p.name||"").toLowerCase().includes(q)||(p.country||"").toLowerCase().includes(q))
    &&(!c||p.country===c)&&(!t||p.title===t)
    &&(!showChamp||p.worldChampion)&&(!showActive||p.active));
  renderGrid(f);
};
window.toggle=function(key){
  if(key==="champ"){showChamp=!showChamp;document.getElementById("btnC").classList.toggle("on",showChamp);}
  else{showActive=!showActive;document.getElementById("btnA").classList.toggle("on",showActive);}
  applyFilters();
};

function renderGrid(players){
  const g=document.getElementById("grid");
  if(!players.length){
    g.innerHTML=`<div class="state"><span class="state-icon">♟</span><h2>No Players Found</h2><p>Try adjusting your search</p></div>`;return;
  }
  g.innerHTML=players.map((p,i)=>{
    const src=photoSrc(p);
    return`<div class="card" data-id="${p.id}" style="animation-delay:${i*.05}s">
      <div class="card-top">
        <div class="card-board"></div>
        <div class="card-bgs">
          <span class="badge bt">${p.title||"GM"}</span>
          ${p.worldChampion?`<span class="badge bc">♛</span>`:""}
          ${p.active?`<span class="badge ba">Active</span>`:""}
        </div>
        <div class="card-av">${src?`<img src="${src}" alt="${p.name}" onerror="this.style.display='none'">`:`<span>${ini(p.name)}</span>`}</div>
      </div>
      <div class="card-body">
        <div class="card-name">${p.name||"—"}</div>
        <div class="card-country">${p.country||""}</div>
        <div class="card-meta">
          <div class="mi"><span class="ml">Born</span><span class="mv">${fmt(p.dob)}</span></div>
          ${p.peakRating?`<div class="mi"><span class="ml">Peak</span><span class="mv g">${p.peakRating}</span></div>`:""}
          ${p.fideId?`<div class="mi"><span class="ml">FIDE</span><span class="mv">${p.fideId}</span></div>`:""}
        </div>
      </div>
      ${(p.gamesCollection||[]).length?`<div class="card-foot">
        <span class="pgn-pill">♟ ${p.gamesCollection.length} game${p.gamesCollection.length>1?"s":""}</span>
        <span style="font-size:11px;color:var(--muted)">View →</span>
      </div>`:`<div style="height:8px"></div>`}
    </div>`;
  }).join("");
  g.querySelectorAll(".card").forEach(el=>el.addEventListener("click",()=>openMod(el.dataset.id)));
}

window.openMod=function(id){
  const p=all.find(x=>x.id===id);if(!p) return;
  const src=photoSrc(p);
  document.getElementById("mAv").innerHTML=src
    ?`<img src="${src}" alt="${p.name}" onerror="this.style.display='none'">`:`<span>${ini(p.name)}</span>`;

  const pgns=p.gamesCollection||[];
  /* PGN download — build blob URL from stored content */
  const pgnHTML=pgns.length?`
    <div class="stitle">♟ Notable Games</div>
    <div class="pgndl">
      ${pgns.map(g=>{
        const blob=new Blob([g.content||""],{type:"application/x-chess-pgn"});
        const url=URL.createObjectURL(blob);
        return`<a href="${url}" download="${g.name}">
          <span style="font-size:16px">♟</span>
          <span class="pn">${g.name}</span>
          <span class="ps">${g.size?(g.size/1024).toFixed(1)+" KB":""}</span>
          <span class="pd">⬇</span></a>`;
      }).join("")}
    </div>`:"";

  document.getElementById("mBody").innerHTML=`
    <div class="mname">${p.name}</div>
    <div class="mchips">
      <span class="chip cg">${p.title||"GM"}</span>
      ${p.worldChampion?`<span class="chip cg">♛ World Champion</span>`:""}
      ${p.active?`<span class="chip cgr">Active</span>`:`<span class="chip cgy">Retired</span>`}
      <span class="chip cgy">${p.country||""}</span>
    </div>
    <div class="igrid">
      <div class="ibox"><div class="il">Date of Birth</div><div class="iv">${fmt(p.dob)}</div></div>
      ${p.dod?`<div class="ibox"><div class="il">Date of Death</div><div class="iv">${fmt(p.dod)}</div></div>`:""}
      ${p.peakRating?`<div class="ibox"><div class="il">Peak Rating</div><div class="iv g">${p.peakRating}</div></div>`:""}
      ${p.fideId?`<div class="ibox"><div class="il">FIDE ID</div><div class="iv">${p.fideId}</div></div>`:""}
    </div>
    ${p.wikipedia?`<a class="wbtn" href="${p.wikipedia}" target="_blank" rel="noopener">📖 View on Wikipedia</a>`:""}
    ${pgnHTML}`;

  document.getElementById("ov").classList.add("open");
  document.body.style.overflow="hidden";
};
window.closeMod=function(e){if(e.target===document.getElementById("ov")) closeModDirect();};
window.closeModDirect=function(){document.getElementById("ov").classList.remove("open");document.body.style.overflow="";};
document.addEventListener("keydown",e=>{if(e.key==="Escape") closeModDirect();});
</script>
</body>
</html>
